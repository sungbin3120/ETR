<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Number Reader Calculator</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f7f7f4;
        color: #181a17;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 360px;
        padding: 24px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.15;
      }
      p {
        line-height: 1.7;
        color: #373832;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>오프라인 상태입니다</h1>
      <p>앱을 처음 실행할 때 필요한 파일을 불러오지 못했습니다. 인터넷 연결 후 다시 열어 주세요.</p>
    </main>
  </body>
</html>
